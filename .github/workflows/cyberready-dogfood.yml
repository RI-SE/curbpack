# Dogfood: run the CyberReady composite Action against this repo.
name: cyberready-dogfood

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - name: Build workspace binary for Action
        run: |
          mkdir -p bin
          go build -o bin/cyberready ./cmd/cyberready
      - name: Init house-policy if missing
        run: |
          if [ ! -f .cyberready.json ]; then
            ./bin/cyberready init --packs house-policy
          fi
      - name: CyberReady check (dogfood Action)
        uses: ./
        with:
          version: latest
          heal: "true"
          prepare_release: "true"
          comment_on: red
          upload_sarif: "true"
