# Drop-in GitHub Action workflow for Curbpack.
# Copy to .github/workflows/curbpack.yml — pin stays @v0.5.0.
name: curbpack-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Curbpack check
        uses: afelin/curbpack@v0.5.1
        with:
          version: v0.5.0
          heal: "true"
          prepare_release: "true"
          comment_on: red
          upload_sarif: "true"
