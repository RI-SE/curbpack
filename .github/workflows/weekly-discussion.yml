name: weekly-discussion

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - name: Build + demo fingerprint
        id: smoke
        run: |
          set -euo pipefail
          go build -o bin/curbpack ./cmd/curbpack
          FIX=$(mktemp -d)
          ./bin/curbpack demo --out "$FIX" --keep >/tmp/demo.out
          SCORE=$(python3 -c "import json;print(json.load(open('${FIX}/.github/curbpack/cache/latest_failure.json')).get('readiness_score',0))")
          FP="demo_ok=true|score=${SCORE}|packs=house-policy"
          echo "fp=${FP}" >> "$GITHUB_OUTPUT"
          echo "score=${SCORE}" >> "$GITHUB_OUTPUT"
      - name: Create Discussion (silent if unchanged)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FP: ${{ steps.smoke.outputs.fp }}
          SCORE: ${{ steps.smoke.outputs.score }}
        with:
          script: |
            const fp = process.env.FP || '';
            const score = process.env.SCORE || '?';
            const marker = `<!-- curbpack-weekly-fp:${fp} -->`;

            const repoIdQuery = await github.graphql(`
              query($owner:String!, $name:String!) {
                repository(owner:$owner, name:$name) {
                  id
                  discussionCategories(first: 20) {
                    nodes { id name }
                  }
                  discussions(first: 10, orderBy:{field:CREATED_AT, direction:DESC}) {
                    nodes { title body }
                  }
                }
              }`, { owner: context.repo.owner, name: context.repo.repo });

            const recent = repoIdQuery.repository.discussions.nodes || [];
            const same = recent.find(d => (d.body || '').includes(marker) || (d.body || '').includes(`curbpack-weekly-fp:${fp}`));
            if (same) {
              core.info(`scoreboard unchanged (${fp}) — skip Discussion (zero babysitting)`);
              return;
            }

            const title = `Weekly offline smoke — demo green (score ${score}%)`;
            const body = [
              marker,
              '## This week\'s offline smoke',
              '',
              `House-policy sandbox (\`curbpack demo\`) is **green** (readiness **${score}%**).`,
              '',
              '### Try it',
              '```bash',
              'curl -fsSL https://raw.githubusercontent.com/afelin/curbpack/main/scripts/install.sh | sh',
              'curbpack doctor && curbpack demo',
              '```',
              '',
              '### Claim safety (do not edit away)',
              '> Prepares evidence for human review — **not** a conformity assessment, CE mark, or certification.',
              '',
              '_Auto-posted from `.github/workflows/weekly-discussion.yml` — skipped when fingerprint unchanged._',
            ].join('\n');

            const nodes = repoIdQuery.repository.discussionCategories.nodes || [];
            const show = nodes.find(n => /show/i.test(n.name)) || nodes[0];
            if (!show) {
              core.warning('No Discussion categories — enable Discussions on the repo. Skipping post.');
              return;
            }
            const created = await github.graphql(`
              mutation($repo:ID!, $cat:ID!, $title:String!, $body:String!) {
                createDiscussion(input:{repositoryId:$repo, categoryId:$cat, title:$title, body:$body}) {
                  discussion { url }
                }
              }`, {
              repo: repoIdQuery.repository.id,
              cat: show.id,
              title,
              body,
            });
            core.info(created.createDiscussion.discussion.url);
