# Drop-in GitHub Action workflow for Curbpack.
# Copy to .github/workflows/curbpack.yml — pin stays @v0.5.2.
# Action runners = Linux/macOS only (local Windows CLI is separate).
# heal defaults to false; this example opts in for missing-stub cold start.
# Compose Trivy/Gitleaks (or other SCA/secret scanners) as sibling jobs beside this check — never vendor them into Curbpack.
# Never set CURBPACK_ALLOW_CONFIRM=1 on the Action — confirms and attest are human-only.
name: curbpack-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Curbpack check
        uses: RI-SE/curbpack@v0.5.2
        with:
          version: v0.5.2
          heal: "true" # opt-in (Action default is false); scaffold ≠ readiness
          prepare_release: "true"
          comment_on: red
          upload_sarif: "true"
