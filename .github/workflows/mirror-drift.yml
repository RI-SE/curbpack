name: mirror-drift

concurrency:
  group: mirror-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  compare-main:
    runs-on: ubuntu-latest
    steps:
      - name: Compare afelin/main vs RI-SE/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC=$(gh api repos/afelin/curbpack/commits/main --jq .sha)
          MIRROR=""
          if out=$(gh api repos/RI-SE/curbpack/commits/main --jq .sha 2>/dev/null); then
            MIRROR="$out"
          fi
          if ! [[ "$MIRROR" =~ ^[0-9a-f]{40}$ ]]; then
            echo "RI-SE/curbpack main unreachable — mirror org settings or SSO may block GITHUB_TOKEN"
            echo "Human: verify corp-origin remote and ./scripts/curb-sync.sh (manual SHA parity)"
            exit 1
          fi
          echo "afelin/main=$SRC"
          echo "RI-SE/main=$MIRROR"
          if [ "$SRC" = "$MIRROR" ]; then
            echo "Mirror aligned"
            exit 0
          fi
          TITLE="Mirror drift: RI-SE/main ≠ afelin/main"
          BODY=$(printf '%s\n' \
            "Source and mirror \`main\` SHAs diverged." \
            "" \
            "- afelin/curbpack @ \`$SRC\`" \
            "- RI-SE/curbpack @ \`$MIRROR\`" \
            "" \
            "Run \`./scripts/curb-sync.sh\` from a clean worktree after merging to source \`main\`." \
            "Never force-push.")
          EXISTING=$(gh issue list --repo afelin/curbpack --search "Mirror drift: RI-SE/main" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo afelin/curbpack --body "Still drifted: afelin=$SRC RI-SE=$MIRROR"
            echo "Updated existing issue #$EXISTING"
            exit 1
          fi
          gh issue create --repo afelin/curbpack --title "$TITLE" --body "$BODY"
          exit 1
