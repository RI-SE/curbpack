name: weekly-discussion

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22.x"
      - name: Build + demo timing
        id: smoke
        run: |
          set -euo pipefail
          go build -o bin/cyberready ./cmd/cyberready
          START=$(date +%s)
          FIX=$(mktemp -d)
          ./bin/cyberready demo --out "$FIX" --keep >/tmp/demo.out
          END=$(date +%s)
          echo "elapsed=$((END-START))" >> "$GITHUB_OUTPUT"
      - name: Create Discussion (claim-safe template)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ELAPSED: ${{ steps.smoke.outputs.elapsed }}
        with:
          script: |
            const elapsed = process.env.ELAPSED || '?';
            const title = `Weekly offline smoke — demo green in ${elapsed}s`;
            const body = [
              '## This week\'s offline smoke',
              '',
              `House-policy sandbox (\`cyberready demo\`) completed in **${elapsed}s** on GitHub-hosted runners.`,
              '',
              '### Try it',
              '```bash',
              'curl -fsSL https://raw.githubusercontent.com/afelin/cyberready/main/scripts/install.sh | sh',
              'cyberready doctor && cyberready demo',
              '```',
              '',
              '### Claim safety (do not edit away)',
              '> Prepares evidence for human review — **not** a conformity assessment, CE mark, or certification.',
              '',
              'Paste a thermometer screenshot in the replies if you ran the demo (optional; names/orgs only with consent).',
              '',
              '_Auto-posted from `.github/workflows/weekly-discussion.yml` — claim-safe template only; no spam bots._',
            ].join('\n');

            const repoIdQuery = await github.graphql(`
              query($owner:String!, $name:String!) {
                repository(owner:$owner, name:$name) {
                  id
                  discussionCategories(first: 20) {
                    nodes { id name }
                  }
                }
              }`, { owner: context.repo.owner, name: context.repo.repo });

            const nodes = repoIdQuery.repository.discussionCategories.nodes || [];
            const show = nodes.find(n => /show/i.test(n.name)) || nodes[0];
            if (!show) {
              core.warning('No Discussion categories — enable Discussions on the repo. Skipping post.');
              return;
            }
            const created = await github.graphql(`
              mutation($repo:ID!, $cat:ID!, $title:String!, $body:String!) {
                createDiscussion(input:{repositoryId:$repo, categoryId:$cat, title:$title, body:$body}) {
                  discussion { url }
                }
              }`, {
              repo: repoIdQuery.repository.id,
              cat: show.id,
              title,
              body,
            });
            core.info(created.createDiscussion.discussion.url);
