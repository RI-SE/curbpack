name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag. Leave empty to use the tested commit's date, vYYYY.MM.DD
        required: false
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish the latest green CI run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/publish.py --tag "${{ inputs.tag }}"
