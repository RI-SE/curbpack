name: chaos-nightly

on:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - name: Build
        run: go build -o bin/cyberready ./cmd/cyberready
      - name: Chaos dead-ends
        run: ./scripts/chaos-deadends.sh ./bin/cyberready
