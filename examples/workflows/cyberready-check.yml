# Example: drop into a product repo as .github/workflows/cyberready.yml
name: cyberready-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: CyberReady check
        # Pin to a release tag in real adopters, e.g. afelin/cyberready@v0.3.0
        uses: afelin/cyberready@v0.3.0
        with:
          version: v0.3.0
          heal: "true"
          prepare_release: "true"
          comment_on: red
          upload_sarif: "true"
